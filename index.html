<div
id="accountProfileView"
style="display:none;"
>

<div
style="
padding:20px;
border:1px solid #e7e7e8;
border-radius:15px;
background:#fafafa;
margin-bottom:18px;
"
>

<div
style="
font-size:10px;
font-weight:700;
color:#aaa;
margin-bottom:5px;
"
>
プロフィール
</div>

<div
id="accountDisplayName"
style="
font-size:24px;
font-weight:800;
letter-spacing:-.03em;
"
>
</div>

<div
id="accountUsername"
style="
font-size:13px;
color:#999;
margin-top:4px;
"
>
</div>

</div>

<form id="displayNameForm">

<label>
表示名

<input
id="profileDisplayNameInput"
type="text"
maxlength="30"
autocomplete="nickname"
placeholder="表示名"
>
</label>

<label>
ユーザーネーム

<input
id="profileUsernameInput"
type="text"
maxlength="20"
pattern="[A-Za-z0-9_]{3,20}"
autocomplete="username"
placeholder="ユーザーネーム"
>
</label>

<div
style="
font-size:11px;
color:#aaa;
margin-top:-7px;
"
>
3〜20文字の英数字と_が使えます
</div>

<div
id="profileMessage"
class="account-message"
>
</div>

<button
type="submit"
class="register-button"
>
保存
</button>

</form>

<button
id="backAccountButton"
type="button"
style="
width:100%;
height:44px;
margin-top:10px;
border:0;
border-radius:10px;
background:#f3f3f4;
color:#555;
font-size:12px;
"
>
戻る
</button>

</div>
